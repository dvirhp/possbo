x-server: &server
  image: possbo-server:local
  build: .

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - possbo_redis:/data
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4200:80"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: possbo_dev
      POSTGRES_USER: possbo
      POSTGRES_PASSWORD: possbo_local_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U possbo -d possbo_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - possbo_postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  migrate:
    <<: *server
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file:
      - server/.env
      - server/.env.local
    environment:
      NODE_ENV: production
    restart: "no"

  api:
    <<: *server
    init: true
    command: ["node", "src/index.js"]
    env_file:
      - server/.env
      - server/.env.local
    environment:
      NODE_ENV: production
      RUN_SCHEDULER: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    <<: *server
    init: true
    command: ["node", "src/worker.js"]
    env_file:
      - server/.env
      - server/.env.local
    environment:
      NODE_ENV: production
      RUN_SCHEDULER: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    shm_size: 1gb
    restart: unless-stopped

volumes:
  possbo_postgres:
  possbo_redis:
