<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
    <defs>
        <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#f3eeff" />
            <stop offset="60%" stop-color="#ede5ff" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="50%" stop-color="#c4b5fd" />
            <stop offset="100%" stop-color="#7c3aed" />
        </radialGradient>
        <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2d1b69" />
            <stop offset="100%" stop-color="#1a0f3c" />
        </linearGradient>
    </defs>

    <!-- Background glow circles -->
    <circle cx="100" cy="105" r="88" fill="url(#bgGlow)" />
    <circle cx="100" cy="105" r="75" fill="#f5f0ff" opacity="0.5" />

    <!-- Sparkle highlights on background -->
    <circle cx="42" cy="75" r="3" fill="white" opacity="0.7" />
    <circle cx="38" cy="82" r="1.5" fill="white" opacity="0.5" />
    <circle cx="158" cy="80" r="2.5" fill="white" opacity="0.6" />
    <circle cx="155" cy="88" r="1.5" fill="white" opacity="0.4" />

    <!-- Body -->
    <ellipse cx="100" cy="160" rx="28" ry="22" fill="white" stroke="#8b5cf6" stroke-width="2.5" />

    <!-- Arm joints -->
    <circle cx="72" cy="148" r="7" fill="white" stroke="#8b5cf6" stroke-width="2" />
    <circle cx="128" cy="148" r="7" fill="white" stroke="#8b5cf6" stroke-width="2" />

    <!-- Head -->
    <circle cx="100" cy="95" r="42" fill="white" stroke="#7c3aed" stroke-width="3" />

    <!-- Antenna stick -->
    <line x1="100" y1="53" x2="100" y2="38" stroke="#7c3aed" stroke-width="2.5"
        stroke-linecap="round" />
    <!-- Antenna ball -->
    <circle cx="100" cy="34" r="5" fill="#7c3aed" />
    <circle cx="100" cy="33" r="2" fill="#a78bfa" opacity="0.6" />

    <!-- Face visor -->
    <rect x="68" y="78" rx="18" ry="18" width="64" height="34" fill="url(#visorGrad)" />

    <!-- Eyes -->
    <circle cx="86" cy="95" r="8" fill="url(#eyeGlow)" />
    <circle cx="86" cy="95" r="4" fill="white" />
    <circle cx="114" cy="95" r="8" fill="url(#eyeGlow)" />
    <circle cx="114" cy="95" r="4" fill="white" />

    <!-- Mouth -->
    <rect x="93" y="104" width="14" height="3" rx="1.5" fill="#67e8f9" />

    <!-- Head shine -->
    <ellipse cx="82" cy="68" rx="8" ry="4" fill="white" opacity="0.5" />
</svg>