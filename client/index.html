<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/possbo-mark-black.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/brand/possbo-mark-white.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/brand/possbo-mark-black.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#667eea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Heebo:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Possbo</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      (function () {
        var t = localStorage.getItem("possbo-theme") || "system";
        var dark =
          t === "dark" ||
          (t === "system" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var bg = dark ? "#0a0a0a" : "#f8fafc";
        window.__POSSBO_SPLASH_LOGO__ = dark
          ? "/brand/possbo-mark-white.png"
          : "/brand/possbo-mark-black.png";
        document.documentElement.style.background = bg;
        document.write(
          "<style>body{margin:0;background:" +
            bg +
            "}#root{background:" +
            bg +
            ";min-height:100vh}#splash{background:" +
            bg +
            "}</style>",
        );
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Inline splash – shown until React mounts, then overwritten -->
      <div
        id="splash"
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
        "
      >
        <img
          src="/brand/possbo-mark-white.png"
          alt=""
          width="80"
          height="80"
          style="
            width: 80px;
            height: 80px;
            max-width: 80px;
            max-height: 80px;
            object-fit: contain;
            animation: sp 1.6s ease-in-out infinite;
          "
        />
        <script>
          document.currentScript.previousElementSibling.src =
            window.__POSSBO_SPLASH_LOGO__;
        </script>
      </div>
      <style>
        @keyframes sp {
          0%,
          100% {
            transform: scale(0.85);
            opacity: 0.6;
          }
          50% {
            transform: scale(1.2);
            opacity: 1;
          }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
